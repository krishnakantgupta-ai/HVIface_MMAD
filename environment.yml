name: deep-learning-env
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - numpy=1.23
  - pandas=1.5
  - scikit-learn=1.2
  - matplotlib
  - seaborn
  - jupyterlab
  - notebook
  - pytorch
  - torchvision
  - torchaudio
                 # Match this with your GPU CUDA version (- cudatoolkit=11.8,
  - tensorflow
  - keras
  - pip:
      - transformers
      - datasets
      - sentencepiece
      - opencv-python
      - tqdm
      - wandb
